<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#07080b">
<meta name="robots" content="noindex">
<title>Page not found — Ebice</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%236d5cff'/%3E%3Ctext x='50' y='68' font-size='58' font-family='Arial,sans-serif' font-weight='800' fill='white' text-anchor='middle'%3EE%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg-0:#07080b;--bg-1:#0d0f14;--bg-2:#12151c;
  --line:#232833;--line-soft:#1a1e27;
  --text-0:#f2f5fb;--text-1:#a8b1c4;--text-2:#6b7589;
  --accent:#6d5cff;--accent-2:#22d3ee;--accent-soft:rgba(109,92,255,.13);
  --r-lg:18px;--r-md:12px;--r-sm:8px;
  --mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
  --sans:'Space Grotesk',-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
}
body{min-height:100vh;background:var(--bg-0);color:var(--text-0);font-family:var(--sans);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;padding:28px 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;overflow-x:hidden}

.bg{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.orb{position:absolute;border-radius:50%;filter:blur(90px);opacity:.5;animation:drift 22s ease-in-out infinite alternate}
.orb.a{width:560px;height:560px;left:-140px;top:-180px;background:rgba(109,92,255,.35)}
.orb.b{width:480px;height:480px;right:-120px;top:10%;background:rgba(34,211,238,.18);animation-duration:28s;animation-delay:-8s}
.orb.c{width:420px;height:420px;left:35%;bottom:-220px;background:rgba(109,92,255,.2);animation-duration:34s;animation-delay:-14s}
@keyframes drift{to{transform:translate(70px,50px) scale(1.12)}}
.grid-bg{position:absolute;inset:0;background-image:linear-gradient(var(--line-soft) 1px,transparent 1px),linear-gradient(90deg,var(--line-soft) 1px,transparent 1px);background-size:56px 56px;opacity:.35;mask-image:radial-gradient(ellipse at 50% 0,#000 10%,transparent 70%);-webkit-mask-image:radial-gradient(ellipse at 50% 0,#000 10%,transparent 70%)}

.rise{opacity:0;transform:translateY(14px);animation:rise .6s cubic-bezier(.2,.7,.2,1) forwards;animation-delay:calc(var(--i,0) * 90ms)}
@keyframes rise{to{opacity:1;transform:none}}

.card{position:relative;z-index:1;max-width:560px;width:100%;text-align:center;background:rgba(13,15,20,.85);border:1px solid var(--line);border-radius:var(--r-lg);padding:46px 36px 38px}
@media(max-width:520px){.card{padding:34px 22px}}

.brand-mark{width:56px;height:56px;margin:0 auto 22px;border-radius:14px;background:linear-gradient(140deg,var(--accent),#4c3fd6 55%,#2b2a66);display:grid;place-items:center;font-weight:700;font-size:26px;color:#fff;box-shadow:0 6px 20px -6px rgba(109,92,255,.7),inset 0 1px 0 rgba(255,255,255,.2)}

.code{font-family:var(--mono);font-size:15px;color:var(--text-2);letter-spacing:.02em}
.code b{color:var(--accent-2);font-weight:500}
h1{margin-top:10px;font-size:34px;font-weight:700;letter-spacing:-.03em}
p{margin-top:12px;color:var(--text-1);max-width:46ch;margin-left:auto;margin-right:auto}

.terminal{margin-top:24px;text-align:left;background:var(--bg-2);border:1px solid var(--line-soft);border-radius:var(--r-md);padding:14px 18px;font-family:var(--mono);font-size:12.5px;color:var(--text-2);overflow-x:auto}
.terminal .ln{display:block;white-space:pre}
.terminal .err{color:#f0455e}
.terminal .ok{color:#2dd4a7}
.terminal .caret{display:inline-block;width:7px;height:14px;background:var(--accent-2);margin-left:2px;vertical-align:middle;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}

.actions{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin-top:26px}
.btn{display:inline-flex;align-items:center;gap:8px;border-radius:var(--r-sm);padding:10px 20px;font-family:var(--sans);font-size:13.5px;font-weight:600;cursor:pointer;border:1px solid var(--line);background:var(--bg-2);color:var(--text-1);text-decoration:none;transition:background .16s,color .16s,border-color .16s,transform .16s}
.btn:hover{background:#191d26;color:var(--text-0);border-color:#313a4b;transform:translateY(-1px)}
.btn-primary{background:linear-gradient(180deg,#7a6bff,var(--accent));border-color:transparent;color:#fff;box-shadow:0 8px 24px -8px rgba(109,92,255,.65),inset 0 1px 0 rgba(255,255,255,.22)}
.btn-primary:hover{background:linear-gradient(180deg,#8a7dff,#7a6bff);color:#fff}
.btn:focus-visible{outline:2px solid var(--accent-2);outline-offset:2px}
.ico{width:15px;height:15px;flex-shrink:0}

.foot{position:relative;z-index:1;display:flex;flex-wrap:wrap;gap:6px 20px;justify-content:center;margin-top:22px;font-size:12px;color:var(--text-2)}
.foot a{color:var(--text-2);text-decoration:none}
.foot a:hover{color:var(--text-0)}
.foot .sep{width:3px;height:3px;border-radius:50%;background:var(--text-2);opacity:.5;align-self:center}

@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-delay:0ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}.rise{opacity:1;transform:none}}
</style>
</head>
<body>

<div class="bg" aria-hidden="true"><div class="grid-bg"></div><div class="orb a"></div><div class="orb b"></div><div class="orb c"></div></div>

<div class="card rise" style="--i:0">
  <div class="brand-mark">E</div>
  <div class="code">Error <b>404</b></div>
  <h1>This page doesn't exist</h1>
  <p>The link may be broken, or the page may have moved. Nothing was lost on your end — your code lives only in your own browser.</p>

  <div class="terminal" aria-hidden="true">
    <span class="ln">&gt; resolve("<span id="path">this page</span>")</span>
    <span class="ln err">x not found<span class="caret"></span></span>
  </div>

  <div class="actions">
    <a class="btn btn-primary" href="https://ebice.site/">
      <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>
      Back to the obfuscator
    </a>
    <a class="btn" href="mailto:contact@ebice.site">
      <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg>
      Report this link
    </a>
  </div>
</div>

<footer class="foot">
  <a href="https://ebice.site/">Obfuscator</a><span class="sep"></span>
  <a href="https://ebice.site/terms">Terms of Service</a><span class="sep"></span>
  <a href="https://ebice.site/privacy/">Privacy Policy</a>
</footer>

<script>
  // Show the path that actually 404'd, when the host serves this file for unknown routes.
  try {
    var p = window.location.pathname;
    if (p && p !== '/404' && p !== '/404.html') document.getElementById('path').textContent = p;
  } catch (e) {}
</script>
</body>
</html>
